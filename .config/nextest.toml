# cargo-nextest runs every test in its own process, so process-global state
# (PATH, HOME, TMUX_TMPDIR, caller identity, cwd, OnceLock caches) can no
# longer leak between concurrently running tests. `#[serial(env)]` keeps its
# meaning for plain `cargo test`; under nextest it is process-local.
#
# Cross-process requirements are kept here:
# - `#[file_serial(tmux)]` already locks across processes.
# - Every other in-process serial key, and every integration binary that
#   serializes its own tests with a static mutex, gets a group with
#   `max-threads = 1`. `nextest_serial_groups_guard` enforces this mapping.
# - Frozen physical suites, PID/process-table probes and wall-clock budget
#   suites run in the exclusive tier: a separate serial invocation that never
#   overlaps any other test (`--profile ci-exclusive`).
#
# The exclusive set appears three times below; the guard requires all three
# copies to be identical.

[test-groups]
exclusive-host = { max-threads = 1 }
serial-status-brief = { max-threads = 1 }
serial-bare-lib = { max-threads = 1 }
serial-b4-mcp = { max-threads = 1 }
serial-pid-probe = { max-threads = 1 }
serial-t3-event = { max-threads = 1 }
serial-excise-backend-display = { max-threads = 1 }
serial-envelope-fidelity = { max-threads = 1 }
serial-doctor-comms = { max-threads = 1 }
serial-msgroute-rm = { max-threads = 1 }
serial-stage3-excision = { max-threads = 1 }

[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 8 }

[[profile.default.overrides]]
# EXCLUSIVE-SET (copy 1 of 3)
filter = 'binary(=pid_reuse_lifecycle_red) | binary(=team_stop_clean_path_red) | binary(=a13_orphan_converge_red) | binary(=a14_session_absence_red) | binary(=unified_start_contract_red) | binary(=stage3_preserve_invariants) | binary(=perf6_shutdown_budget_red) | binary(=b5_leader_terminal_kill_red)'
test-group = 'exclusive-host'

# serial(status_brief)
[[profile.default.overrides]]
filter = 'package(=team-agent) & kind(lib) & test(/^cli::tests::status_brief::/)'
test-group = 'serial-status-brief'

# bare serial inside the library test process
[[profile.default.overrides]]
filter = 'package(=team-agent) & kind(lib) & (test(/^leader::tests::team_in_team_state_scope_red::/) | test(/^lifecycle::tests::team_in_team_state_scope_red::/))'
test-group = 'serial-bare-lib'

# serial(b4_mcp)
[[profile.default.overrides]]
filter = 'package(=team-agent) & kind(lib) & test(/^lifecycle::tests::swallow_batch4_semantics_red::/)'
test-group = 'serial-b4-mcp'

# serial(env, pid_probe)
[[profile.default.overrides]]
filter = 'package(=team-agent) & kind(lib) & (test(/^lifecycle::tests::host_cotenant_death_p0_contract::/) | test(/^lifecycle::tests::status_credential_redaction_contract::/))'
test-group = 'serial-pid-probe'

# serial(t3_event)
[[profile.default.overrides]]
filter = 'package(=team-agent) & kind(lib) & test(/^lifecycle::tests::harvest2_a_batch_red::/)'
test-group = 'serial-t3-event'

# bare serial in an integration binary
[[profile.default.overrides]]
filter = 'binary(=excise_backend_display_contract)'
test-group = 'serial-excise-backend-display'

# serial(envelope_fidelity)
[[profile.default.overrides]]
filter = 'binary(=envelope_fidelity_roundtrip_red)'
test-group = 'serial-envelope-fidelity'

# serial(doctor_comms)
[[profile.default.overrides]]
filter = 'binary(=doctor_comms_red)'
test-group = 'serial-doctor-comms'

# serial(msgroute_rm)
[[profile.default.overrides]]
filter = 'binary(=msg_routing_presentation_red)'
test-group = 'serial-msgroute-rm'

# bare serial in an integration binary
[[profile.default.overrides]]
filter = 'binary(=stage3_excision_red)'
test-group = 'serial-stage3-excision'

# Parallel tier: everything outside the exclusive set.
[profile.ci]
test-threads = "num-cpus"
# EXCLUSIVE-SET (copy 2 of 3)
default-filter = 'not (binary(=pid_reuse_lifecycle_red) | binary(=team_stop_clean_path_red) | binary(=a13_orphan_converge_red) | binary(=a14_session_absence_red) | binary(=unified_start_contract_red) | binary(=stage3_preserve_invariants) | binary(=perf6_shutdown_budget_red) | binary(=b5_leader_terminal_kill_red))'

[profile.ci.junit]
path = "junit.xml"

# Exclusive tier: the excluded set, one test at a time, after the parallel tier.
[profile.ci-exclusive]
test-threads = 1
# EXCLUSIVE-SET (copy 3 of 3)
default-filter = 'binary(=pid_reuse_lifecycle_red) | binary(=team_stop_clean_path_red) | binary(=a13_orphan_converge_red) | binary(=a14_session_absence_red) | binary(=unified_start_contract_red) | binary(=stage3_preserve_invariants) | binary(=perf6_shutdown_budget_red) | binary(=b5_leader_terminal_kill_red)'

[profile.ci-exclusive.junit]
path = "junit.xml"
