name: Publish npm

on:
  push:
    branches:
      - release/0.3.x
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Rust
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Verify package metadata
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const cargo = fs.readFileSync("Cargo.toml", "utf8");
          const expected = {
            version: "0.6.0",
            license: "AGPL-3.0",
            platforms: [
              ["cli-darwin-arm64", "@team-agent/cli-darwin-arm64", "darwin", "arm64"],
              ["cli-darwin-x64", "@team-agent/cli-darwin-x64", "darwin", "x64"],
              ["cli-linux-x64", "@team-agent/cli-linux-x64", "linux", "x64"],
            ],
          };
          function fail(message) {
            console.error(message);
            process.exit(1);
          }
          if (root.name !== "@team-agent/installer") fail(`unexpected package name ${root.name}`);
          if (root.version !== expected.version) fail(`unexpected package version ${root.version}`);
          if (root.license !== expected.license) fail(`unexpected package license ${root.license}`);
          if (!cargo.includes(`version = "${expected.version}"`)) fail("Cargo.toml version mismatch");
          if (!cargo.includes(`license = "${expected.license}"`)) fail("Cargo.toml license mismatch");
          for (const [dir, name, os, cpu] of expected.platforms) {
            const pkg = JSON.parse(fs.readFileSync(`npm/platform-packages/${dir}/package.json`, "utf8"));
            if (pkg.name !== name) fail(`${dir}: unexpected name ${pkg.name}`);
            if (pkg.version !== expected.version) fail(`${dir}: unexpected version ${pkg.version}`);
            if (pkg.license !== expected.license) fail(`${dir}: unexpected license ${pkg.license}`);
            if (pkg.os?.[0] !== os) fail(`${dir}: unexpected os ${pkg.os}`);
            if (pkg.cpu?.[0] !== cpu) fail(`${dir}: unexpected cpu ${pkg.cpu}`);
            if (root.optionalDependencies?.[name] !== expected.version) {
              fail(`${name}: missing optionalDependency ${expected.version}`);
            }
          }
          NODE

      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}"
            exit 1
          fi

      - name: Ensure tmux and Python for tests
        run: |
          if ! command -v tmux >/dev/null || ! command -v python3 >/dev/null; then
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get update
              sudo apt-get install -y tmux python3
            else
              brew install tmux python
            fi
          fi
          tmux -V
          python3 --version

      - name: Prepare isolated serial test environment
        run: |
          set -euo pipefail
          test_root="$(mktemp -d /tmp/ta-ci.XXXXXXXX)"
          test_root="$(cd "$test_root" && pwd -P)"
          mkdir -m 700 "$test_root/bin"
          # Keep the public filename and PATH parent after fixture canonicalization.
          # A symlink to Ubuntu's versioned Python would lose that identity.
          python="$(command -v python3)"
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$python" > "$test_root/bin/python3"
          chmod 700 "$test_root/bin/python3"
          echo "$test_root/bin" >> "$GITHUB_PATH"
          {
            echo "RUST_TEST_THREADS=1"
            echo "TERM=xterm-256color"
            # Match native tmux on Linux; retain the native macOS temporary root.
            if [ "$RUNNER_OS" = Linux ]; then
              echo "TMPDIR=/tmp"
            else
              echo "TMPDIR=${TMPDIR:-/tmp}"
            fi
          } >> "$GITHUB_ENV"
          printf 'Public Python: %s\nTest root: %s\n' "$python" "$test_root"

      - name: Record test environment
        run: |
          uname -a
          python3 - <<'PY'
          import os, pathlib, shutil, sys
          launcher = pathlib.Path(shutil.which("python3"))
          print("python_launcher:", launcher, "canonical:", launcher.resolve())
          print("python_image:", sys.executable, "canonical:", pathlib.Path(sys.executable).resolve())
          print("clock_ticks:", os.sysconf("SC_CLK_TCK"))
          for name in ("RUST_TEST_THREADS", "TERM", "TMPDIR"):
              print(name + ":", os.environ[name])
          PY

      - name: Install cargo-nextest
        env:
          NEXTEST_VERSION: "0.9.152"
          NEXTEST_SHA256: "d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${NEXTEST_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          cargo nextest --version

      - name: Compile Rust tests
        run: cargo test --workspace --locked --no-run

      - name: Build Rust CLI
        run: cargo build --release --bin team-agent --locked

      - name: Verify CLI help
        run: ./target/release/team-agent --help >/tmp/team-agent-help.txt

      - name: Verify minimum same-boot history for PID reuse fixtures
        run: |
          python3 - <<'PY'
          import pathlib
          observed = float(pathlib.Path("/proc/uptime").read_text().split()[0])
          # The relative 180s fixture needs >300s of real same-boot history.
          # Compile first; never sleep, fake kernel timestamps, or skip tests.
          print(f"VM uptime after compilation: {observed:.2f}s", flush=True)
          if observed <= 300:
              raise SystemExit(f"Insufficient same-boot history: {observed:.2f}s; require >300s")
          PY

      # One process per test; see .config/nextest.toml for the serialized groups.
      - name: Run Rust tests (parallel tier)
        id: parallel_tests
        run: cargo nextest run --workspace --locked --profile ci

      # Runs after parallel failures for diagnostics, never when the parallel
      # tier was skipped (failed build or same-boot history preflight).
      - name: Run Rust tests (exclusive serial tier)
        if: ${{ !cancelled() && steps.parallel_tests.conclusion != 'skipped' }}
        run: cargo nextest run --workspace --locked --profile ci-exclusive

      - name: Run Rust doctests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --locked --doc

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit
          path: target/nextest/*/junit.xml
          if-no-files-found: warn

      - name: Verify package dry runs
        run: |
          npm pack --dry-run
          for package_dir in npm/platform-packages/*; do
            (cd "$package_dir" && npm pack --dry-run)
          done

      - name: Verify installer package boundary
        run: |
          npm pack --ignore-scripts --dry-run --json > "$RUNNER_TEMP/team-agent-pack.json"
          node <<'NODE'
          const fs = require("node:fs");
          const [{files}] = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/team-agent-pack.json`, "utf8"));
          const unexpected = files.filter(({path}) => path.startsWith("crates/") || /^Cargo\.(toml|lock)$/.test(path));
          if (unexpected.length) throw new Error("Installer must not ship unused or incomplete Rust workspaces");
          NODE

  build-platform:
    name: Build ${{ matrix.package_name }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            package_dir: cli-darwin-arm64
            package_name: "@team-agent/cli-darwin-arm64"
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            package_dir: cli-darwin-x64
            package_name: "@team-agent/cli-darwin-x64"
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            package_dir: cli-linux-x64
            package_name: "@team-agent/cli-linux-x64"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # C-1 cr verdict — linux-only musl-tools(`musl-gcc` linker) 是 musl 静态构建
      # 必需。条件门 `runner.os == 'Linux'` 仅限 Linux，
      # mac runner 完全不触发该步。
      - name: Install musl tools (linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Set up Rust
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustup target add "${{ matrix.target }}"
          rustc --version
          cargo --version

      - name: Build binary
        run: cargo build --release --bin team-agent --target "${{ matrix.target }}" --locked

      # C-3 cr verdict — 静态断言发布前置门。Linux 包必须:
      #   ① `file` 报告 statically linked(musl 产物;接受 "statically linked"
      #      或 "static-pie linked" — 新 Rust toolchain musl 默认 static PIE,
      #      `file` 输出 "static-pie linked, ..." 同样是无 dynamic loader 的静态);
      #   ② `objdump -T` 取的动态符号表里 GLIBC_ 计数 == 0
      #   (musl 产物根本不应出现任何 GLIBC_ 版本符号)。
      # C-4 反向:把 publish-npm.yml 的 linux target 改回 x86_64-unknown-linux-gnu
      # 再发,本步必失败(file 不报 statically/static-pie linked / GLIBC_ 计数 > 0)
      # → 拦在 publish 之前。
      - name: Assert linux binary is statically linked with no GLIBC_ symbols
        if: runner.os == 'Linux'
        run: |
          binary="target/${{ matrix.target }}/release/team-agent"
          file_info="$(file "$binary")"
          echo "file: $file_info"
          if ! echo "$file_info" | grep -Eq 'statically linked|static-pie linked'; then
            echo "::error::linux binary is not statically linked: $file_info"
            exit 1
          fi
          glibc_count="$(objdump -T "$binary" 2>/dev/null | grep -c 'GLIBC_' || true)"
          echo "objdump -T | grep -c GLIBC_ = ${glibc_count}"
          if [ "${glibc_count}" != "0" ]; then
            echo "::error::linux binary still carries GLIBC_ version symbols (count=${glibc_count})"
            objdump -T "$binary" | grep 'GLIBC_' | sort -u | head
            exit 1
          fi

      - name: Fill platform package
        run: |
          binary="target/${{ matrix.target }}/release/team-agent"
          package_bin="npm/platform-packages/${{ matrix.package_dir }}/bin/team-agent"
          test -x "$binary"
          cp "$binary" "$package_bin"
          chmod 755 "$package_bin"
          version="$(node -p "require('./package.json').version")"
          test "$("$package_bin" --version)" = "team-agent $version"
          "$package_bin" --help >/tmp/team-agent-help.txt
          (cd "npm/platform-packages/${{ matrix.package_dir }}" && npm pack --dry-run)

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_dir }}
          path: npm/platform-packages/${{ matrix.package_dir }}
          if-no-files-found: error

  publish-platform:
    name: Publish ${{ matrix.package_name }}
    if: github.ref_type == 'tag'
    needs: build-platform
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_dir: cli-darwin-arm64
            package_name: "@team-agent/cli-darwin-arm64"
          - package_dir: cli-darwin-x64
            package_name: "@team-agent/cli-darwin-x64"
          - package_dir: cli-linux-x64
            package_name: "@team-agent/cli-linux-x64"

    steps:
      - name: Download platform package
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.package_dir }}
          path: dist/${{ matrix.package_dir }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish platform package
        run: npm publish --access public
        working-directory: dist/${{ matrix.package_dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PUBLISH }}

  publish-main:
    name: Publish @team-agent/installer
    if: github.ref_type == 'tag'
    needs: publish-platform
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish main package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PUBLISH }}
