name: Scoped source authority CI
run-name: scoped-ci ${{ inputs.candidate }}

# Temporary dispatch carrier; source is always an admitted full commit SHA.
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Fixed candidate and command whitelist
        required: true
        type: choice
        options:
          - binding-159
          - rules-t02
          - state-s1-baseline
          - state-s1
          - config-t01
          - rules-t01
          - config-t02
          - rules-t03
          - state-s3-baseline
          - state-s3
          - config-t03
          - config-t04
          - state-s2-baseline
          - state-s2
          - config-t05
          - config-t06
          - config-t07


permissions:
  contents: read
concurrency:
  group: source-authority-scoped-ci-20260912
  cancel-in-progress: false

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CANDIDATE: ${{ inputs.candidate }}
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_TERM_COLOR: never
    steps:
      - name: Admit fixed candidate
        id: admit
        shell: python
        run: |
          import json, os, pathlib, re
          candidates = json.loads(r'''{"binding-159":{"id":"binding-159","sha":"f54eb5a4b77cc318ed511cc31b73caed925ae022","tree":"52396923ac8d9080887d3b1332571dbd16e6eac1","lib_selectors":[{"selector":"seeded_cas_conflict_preserves_same_owner_receiver_and_registry_through_bind_rollback","expected_parent_tests":1},{"selector":"fresh_attach_topology_conflict_preserves_cause_and_concurrent_state","expected_parent_tests":1}]},"rules-t02":{"id":"rules-t02","sha":"fdd179e17387684965f8e5d7eca777076a1ee6c9","tree":"19333e7e1d05a4fdeeb8756ac1d4fdfe143d9bac","lib_selectors":[{"selector":"rules_t02_","expected_parent_tests":3},{"selector":"copilot_mcp_config_uses_copilot_field_name","expected_parent_tests":1},{"selector":"copilot_resume_argv_has_no_session_id_resume_conflict","expected_parent_tests":1}]},"state-s1-baseline":{"id":"state-s1-baseline","sha":"130c7ce5872a6d06e530d9f7a20caffcea3fd29e","tree":"81050662d654b6778079c0e8c264769236510491","lib_selectors":[{"selector":"leader::rediscover::tests::s1_","expected_parent_tests":3}]},"state-s1":{"id":"state-s1","sha":"28d51321306961d8e53429270eb1239516aaa032","tree":"2fe0c63d1309ad6b6baf443344ff449886b85e6e","lib_selectors":[{"selector":"leader::rediscover::tests::s1_","expected_parent_tests":3},{"selector":"leader::rediscover::tests::","expected_parent_tests":null}]},"config-t01":{"id":"config-t01","sha":"dd497261865affddbb3c7435573963b39bc941a6","tree":"42fb694037ffa4b4fef2c69b35b7a0277ba135aa","lib_selectors":[{"selector":"config_authority_t01","expected_parent_tests":3},{"selector":"communication_mode_runtime_contract_red","expected_parent_tests":null},{"selector":"phase_b_contracts","expected_parent_tests":null}],"integration_tests":["communication_mode_config_red"],"prebuild_binary":true},"rules-t01":{"id":"rules-t01","sha":"7f007673b647c1d3607314240af0ab3456df556e","tree":"d3ae8d6ac591ad7c67e456ca57f8470bf7efb561","lib_selectors":[{"selector":"rules_t01_","expected_parent_tests":6},{"selector":"decide_start_mode_","expected_parent_tests":6},{"selector":"classify_restart_plan_","expected_parent_tests":8},{"selector":"restart_required_missing_","expected_parent_tests":3}],"prebuild_binary":true},"config-t02":{"id":"config-t02","sha":"b6f128c55f9ef7b0de81d46ae3ac3cbc19e7a3b4","tree":"d49ba5d176cd946283ca3b2789ef31eefb7017ad","lib_selectors":[{"selector":"config_authority_t02","expected_parent_tests":4},{"selector":"compiler::tests","expected_parent_tests":null},{"selector":"pi_compiler_red","expected_parent_tests":null},{"selector":"grok_require_explicit_model_red","expected_parent_tests":null},{"selector":"cursor_require_explicit_model_red","expected_parent_tests":null},{"selector":"claude_profile_launch_red","expected_parent_tests":null},{"selector":"config_authority_t01","expected_parent_tests":3}],"prebuild_binary":true},"rules-t03":{"id":"rules-t03","sha":"0398ecca9c53fd8522e90b4365d6ab823bdd5daf","tree":"6177875e5fa28fa4812894ac9e7179f3290ff867","lib_selectors":[{"selector":"rules_t03_","expected_parent_tests":6}],"integration_tests":["send_mailbox_universal_paths_red"],"expected_integration_tests":{"send_mailbox_universal_paths_red":2},"prebuild_binary":true},"state-s3-baseline":{"id":"state-s3-baseline","sha":"7c9d43ed2857fde5ccae1f871da6ce5b230ffab8","tree":"ccbd84863f701335a8524a07530a7d0e3e80dc02","lib_selectors":[{"selector":"coordinator::tests::s3_bounded::","expected_parent_tests":4,"expected_ignored":1}]},"state-s3":{"id":"state-s3","sha":"3c501091f0538fd55df0371321c2ac25d1261711","tree":"ebfc01ea4de1b9f0e184e087cfb3d8d3978ca124","lib_selectors":[{"selector":"coordinator::tests::s3_bounded::","expected_parent_tests":4,"expected_ignored":1},{"selector":"state::persist::tests::","expected_parent_tests":null}],"integration_tests":["mcp_server_assign_task_red","mcp_lifecycle_state_status_red","s1a_state_repository_contract"],"prebuild_binary":true},"config-t03":{"id":"config-t03","sha":"3f390af94a1d04ce41036f3a2567d2860177335e","tree":"0bcbef073a4c86411d9a29f45da876dd47d05aa6","lib_selectors":[{"selector":"config_authority_t03","expected_parent_tests":3}],"integration_tests":["profile_smoke_red"],"prebuild_binary":true},"config-t04":{"id":"config-t04","sha":"75f5957a14383d4118189043600b2d6245ba08a5","tree":"3a0a14ea2f6c5fada57fd7bfe9c1aa3929bc5d7c","lib_selectors":[{"selector":"config_authority_t04","expected_parent_tests":1},{"selector":"verb_profile","expected_parent_tests":null}],"prebuild_binary":true},"state-s2-baseline":{"id":"state-s2-baseline","sha":"01660796d3f758fe95ef6b298503953c09a3b910","tree":"26f996bb499bfd7eb40b0d218c407a1c710d9708","lib_selectors":[{"selector":"messaging::results::collection_tests::s2_original_finalize_window_recovers","expected_parent_tests":1,"harness_args":["--exact","--nocapture"]}]},"state-s2":{"id":"state-s2","sha":"a3bf25063a9a7b5f38c1fb124cc7cae49ee06fef","tree":"9bd2c6906f51a2041d1aada20e48ec62b46f12a0","lib_selectors":[{"selector":"messaging::results::collection_tests::","expected_parent_tests":5,"expected_ignored":1},{"selector":"coordinator::tests::s3_bounded::","expected_parent_tests":4,"expected_ignored":1},{"selector":"messaging::tests::runtime::collect_","expected_parent_tests":6},{"selector":"messaging::tests::main_preserved::collect_result_file_ingests_valid_known_task_envelope_into_results","expected_parent_tests":1,"harness_args":["--exact","--nocapture","--test-threads=1"]},{"selector":"cli::tests::main_preserved::collect_uncollected_result_marks_db_and_outputs_result","expected_parent_tests":1,"harness_args":["--exact","--nocapture","--test-threads=1"]}],"prebuild_binary":true},"config-t05":{"id":"config-t05","sha":"460c5e36fba8a0a3ef27e91cbd48bdad1013a6a3","tree":"bd00e14c56869dc9305ffd2362fa0d4e267a1015","lib_selectors":[{"selector":"config_authority_t05","expected_parent_tests":3},{"selector":"verb_profile","expected_parent_tests":null}],"prebuild_binary":true},"config-t06":{"id":"config-t06","sha":"db09afab298eb6e006d5408521e972a8a4c453a1","tree":"16039b9c340ea660a9a3dd18a0ca127376289f1d","lib_selectors":[{"selector":"config_authority_t06","expected_parent_tests":2}],"integration_tests":["clone_fork_latest_role_red","clone_agent_preserves_source_tools"],"prebuild_binary":true},"config-t07":{"id":"config-t07","sha":"d5007311309da22d793624921ac32fb526e8e6a9","tree":"2249db41637fd974798ed9ce42c5e3a3d6f324fe","lib_selectors":[{"selector":"config_authority_t07","expected_parent_tests":3},{"selector":"grok_effort_argv_red","expected_parent_tests":null},{"selector":"pi_compiler_red","expected_parent_tests":null}],"integration_tests":["provider_effort_mvp_red"],"prebuild_binary":true}}''')
          entry = candidates[os.environ['CANDIDATE']]
          assert os.environ['GITHUB_REPOSITORY'] == 'Florious95/team-agent'
          assert all(re.fullmatch('[0-9a-f]{40}', entry[k]) for k in ['sha', 'tree'])
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'scoped-ci-evidence'
          evidence.mkdir()
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              print('EVIDENCE_DIR=' + str(evidence), file=out)
          (evidence / 'request.json').write_text(json.dumps(entry, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('sha=' + entry['sha'], file=out)
              print('tree=' + entry['tree'], file=out)
          print(json.dumps(entry, indent=2))

      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          repository: Florious95/team-agent
          ref: ${{ steps.admit.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify HEAD and tree
        id: identity
        shell: python
        run: |
          import json, os, pathlib, subprocess
          evidence = pathlib.Path(os.environ['EVIDENCE_DIR'])
          entry = json.loads((evidence / 'request.json').read_text())
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          identity = {k: os.environ[k] for k in ['GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'GITHUB_WORKFLOW_SHA', 'GITHUB_WORKFLOW_REF', 'GITHUB_SHA', 'GITHUB_REF', 'RUNNER_OS', 'RUNNER_ARCH']}
          identity.update(head=git('rev-parse', 'HEAD'), tree=git('rev-parse', 'HEAD^{tree}'), clean=not git('status', '--porcelain=v1', '--untracked-files=all'))
          (evidence / 'source.json').write_text(json.dumps(identity, indent=2) + '\n')
          print(json.dumps(identity, indent=2))
          assert identity['head'] == entry['sha'] and identity['tree'] == entry['tree'] and identity['clean']

      - name: Install fixed Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal 2>&1 | tee "$EVIDENCE_DIR/toolchain-install.log"
          rustc -vV | tee "$EVIDENCE_DIR/rustc-version.txt"
          cargo --version | tee "$EVIDENCE_DIR/cargo-version.txt"
          test "$(rustc --version | cut -d ' ' -f 2)" = "$RUSTUP_TOOLCHAIN"

      - name: Install required isolated tmux fixture dependency
        if: inputs.candidate == 'state-s3' || inputs.candidate == 'config-t06'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update 2>&1 | tee "$EVIDENCE_DIR/apt-update.log"
          sudo apt-get install --no-install-recommends -y tmux 2>&1 | tee "$EVIDENCE_DIR/tmux-install.log"
          tmux -V | tee "$EVIDENCE_DIR/tmux-version.txt"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: scoped-registry-v1-${{ runner.os }}-${{ runner.arch }}-rust1.95.0-${{ hashFiles('Cargo.lock') }}

      - name: Cache scoped Cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: scoped-target-v1-${{ runner.os }}-${{ runner.arch }}-rust1.95.0-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-libdebug-${{ steps.admit.outputs.sha }}
          restore-keys: |
            scoped-target-v1-${{ runner.os }}-${{ runner.arch }}-rust1.95.0-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-libdebug-

      - name: Execute admitted commands and record real exits
        id: tests
        timeout-minutes: 28
        shell: python
        run: |
          import datetime, hashlib, json, os, pathlib, re, shlex, subprocess, sys
          evidence = pathlib.Path(os.environ['EVIDENCE_DIR'])
          entry = json.loads((evidence / 'request.json').read_text())
          identity = json.loads((evidence / 'source.json').read_text())
          commands = []
          if entry.get('prebuild_binary'):
              commands.append((['cargo', 'build', '--locked', '-p', 'team-agent', '--bin', 'team-agent'], None, None))
          for item in entry['lib_selectors']:
              commands.append((['cargo', 'test', '--locked', '-p', 'team-agent', '--lib', item['selector'], '--'] + item.get('harness_args', ['--nocapture', '--test-threads=1']), item['expected_parent_tests'], item.get('expected_ignored')))
          for target in entry.get('integration_tests', []):
              commands.append((['cargo', 'test', '--locked', '-p', 'team-agent', '--test', target, '--', '--nocapture', '--test-threads=1'], entry.get('expected_integration_tests', {}).get(target), None))
          (evidence / 'command-plan.json').write_text(json.dumps(commands, indent=2) + '\n')
          results = []
          for index, (argv, expected, expected_ignored) in enumerate(commands, 1):
              head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
              assert head == entry['sha'] and tree == entry['tree']
              assert not subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'], text=True).strip()
              log = evidence / f'command-{index:02d}.log'
              started = datetime.datetime.now(datetime.timezone.utc).isoformat()
              print(f'COMMAND {index}: {shlex.join(argv)}', flush=True)
              print(f'SOURCE HEAD={head} TREE={tree}', flush=True)
              with log.open('wb') as out:
                  process = subprocess.Popen(argv, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  for line in process.stdout:
                      out.write(line)
                      out.flush()
                      sys.stdout.buffer.write(line)
                      sys.stdout.buffer.flush()
                  exit_code = process.wait()
              text = log.read_text(errors='replace')
              summaries = [dict(zip(['result', 'passed', 'failed', 'ignored', 'measured', 'filtered'], m)) for m in re.findall(r'test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out', text)]
              for summary in summaries:
                  for key in list(summary)[1:]:
                      summary[key] = int(summary[key])
              parent = summaries[-1] if summaries else None
              count = parent['passed'] + parent['failed'] if parent else 0
              is_test = argv[1] == 'test'
              count_ok = not is_test or (parent is not None and count > 0 and (expected is None or count == expected) and (expected_ignored is None or parent['ignored'] == expected_ignored))
              receipt = dict(command=shlex.join(argv), argv=argv, exit_code=exit_code, log_path=log.name, log_sha256=hashlib.sha256(log.read_bytes()).hexdigest(), started_at=started, finished_at=datetime.datetime.now(datetime.timezone.utc).isoformat(), source=identity, expected_parent_tests=expected, expected_ignored=expected_ignored, executed_parent_tests=count if is_test else None, parent_summary=parent, all_summaries_in_log=summaries, count_ok=count_ok)
              results.append(receipt)
              (evidence / 'results.json').write_text(json.dumps(results, indent=2) + '\n')
              (evidence / f'command-{index:02d}.exit').write_text(str(exit_code) + '\n')
              print('RECEIPT ' + json.dumps(receipt), flush=True)
              if exit_code != 0 or not count_ok:
                  print('::error::Command failed or actual parent test count did not meet the contract; remaining commands were not executed.', flush=True)
                  sys.exit(exit_code if 0 < exit_code < 256 else 1)

      - name: Upload source bound evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoped-ci-${{ inputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scoped-ci-evidence/
          if-no-files-found: error
          retention-days: 14
