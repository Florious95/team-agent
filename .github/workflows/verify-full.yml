name: Verify full workspace

on:
  push:
    branches:
      - integration/0.5.x
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-hex commit SHA to verify
        required: true
        type: string
  workflow_call:
    inputs:
      target_sha:
        description: Optional exact 40-hex commit SHA to verify
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  verify:
    name: Full Rust tests (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0

      - name: Verify checked out SHA
        env:
          EXPECTED_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          expected_sha="${EXPECTED_SHA}"
          if [[ ! "${expected_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid expected SHA: ${expected_sha}" >&2
            exit 1
          fi
          expected_sha="$(printf '%s' "${expected_sha}" | tr '[:upper:]' '[:lower:]')"
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${expected_sha}" ]]; then
            echo "Checked out SHA mismatch: expected ${expected_sha}, got ${actual_sha}" >&2
            exit 1
          fi
          echo "Verified exact SHA: ${actual_sha}"

      - name: Set up Rust
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Preflight tmux (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v tmux
          tmux -V

      - name: Run Rust tests
        run: cargo test --workspace --all-targets --locked --no-fail-fast
