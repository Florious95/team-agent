name: Verify full workspace

on:
  push:
    branches:
      - integration/0.5.x
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  verify:
    name: Full Rust tests (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    env:
      TEAM_AGENT_GATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Rust
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Preflight tmux (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v tmux
          tmux -V

      - name: Run Rust tests
        env:
          TEAM_AGENT_E2E_EVIDENCE_DIR: ${{ runner.temp }}/team-agent-e2e-evidence
        run: cargo test --workspace --all-targets --locked --no-fail-fast

      - name: Upload E2E failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/team-agent-e2e-evidence
          if-no-files-found: ignore
