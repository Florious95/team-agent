name: Verify full workspace

on:
  push:
    branches:
      - integration/0.5.x
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-hex commit SHA to verify
        required: true
        type: string
      test_profile:
        description: Closed test profile to run
        required: true
        type: choice
        options:
          - full
          - f04-r4
          - f05-rec002
          - f14-containment
          - f16-wleak
          - f17-wleak-metadata
        default: full
  workflow_call:
    inputs:
      target_sha:
        description: Optional exact 40-hex commit SHA to verify
        required: false
        type: string
        default: ''
      test_profile:
        description: Closed test profile to run
        required: false
        type: string
        default: full

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  verify:
    name: Full Rust tests (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0

      - name: Verify checked out SHA
        env:
          EXPECTED_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          expected_sha="${EXPECTED_SHA}"
          if [[ ! "${expected_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid expected SHA: ${expected_sha}" >&2
            exit 1
          fi
          expected_sha="$(printf '%s' "${expected_sha}" | tr '[:upper:]' '[:lower:]')"
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${expected_sha}" ]]; then
            echo "Checked out SHA mismatch: expected ${expected_sha}, got ${actual_sha}" >&2
            exit 1
          fi
          echo "Verified exact SHA: ${actual_sha}"

      - name: Set up Rust
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Preflight tmux (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v tmux
          tmux -V

      - name: Run Rust tests
        env:
          TEST_PROFILE: ${{ inputs.test_profile || 'full' }}
        run: |
          set -euo pipefail
          case "${TEST_PROFILE}" in
            full)
              cargo test --workspace --all-targets --locked --no-fail-fast
              ;;
            f04-r4)
              cargo test -p team-agent --test clone_fork_parallel_lifecycle_red --locked r4_parallel_n_clones_have_pairwise_unique_new_sessions -- --exact --nocapture --test-threads=1
              ;;
            f05-rec002)
              cargo test -p team-agent --test e2e --locked cases::rec_002_doctor_checks::rec_002_doctor_checks -- --exact --nocapture --test-threads=1
              ;;
            f14-containment)
              cargo test -p team-agent --locked --test e2e framework::containment_tests::f14_owned_socket_registration_is_exact_and_drop_spares_unregistered_socket -- --exact --nocapture --test-threads=1
              cargo test -p team-agent --locked --test e2e cases::send_001_fake_worker::send_001_delivers_to_fake_worker -- --exact --nocapture --test-threads=1
              ;;
            f16-wleak)
              cargo test -p team-agent --locked --test e2e cases::wleak_worker_delivery_socket_leak_contract::wleak_cached_pane_owned_by_other_window_never_receives_worker_message -- --exact --nocapture --test-threads=1
              ;;
            f17-wleak-metadata)
              cargo test -p team-agent --locked --test e2e cases::wleak_worker_delivery_socket_leak_contract::wleak_message_delivered_event_records_physical_target_metadata -- --exact --nocapture --test-threads=1
              ;;
            *)
              echo "Invalid test profile: ${TEST_PROFILE}" >&2
              exit 1
              ;;
          esac
