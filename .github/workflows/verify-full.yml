name: Verify full workspace

on:
  push:
    branches:
      - integration/0.5.x
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-hex commit SHA to verify
        required: true
        type: string
      test_profile:
        description: Closed test profile to run
        required: true
        type: choice
        options:
          - full
          - a6-message-funnel
          - f04-r4
          - f05-rec002
          - f07-c5-diagnostic
          - f11-e6
          - f11-e6-causal
          - f11-e6-cohort
          - f14-containment
          - f14-a3-e2e-default
          - f14-a3-same-composition-e2e-diagnostic
          - f14-a3-same-composition-e2e-causal
          - f14-a3-same-composition-full-diagnostic
          - f15-gate061
          - f16-wleak
          - f17-wleak-metadata
        default: full
  workflow_call:
    inputs:
      target_sha:
        description: Optional exact 40-hex commit SHA to verify
        required: false
        type: string
        default: ''
      test_profile:
        description: Closed test profile to run
        required: false
        type: string
        default: full

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  verify:
    name: Full Rust tests (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0

      - name: Verify checked out SHA
        env:
          EXPECTED_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          expected_sha="${EXPECTED_SHA}"
          if [[ ! "${expected_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid expected SHA: ${expected_sha}" >&2
            exit 1
          fi
          expected_sha="$(printf '%s' "${expected_sha}" | tr '[:upper:]' '[:lower:]')"
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${expected_sha}" ]]; then
            echo "Checked out SHA mismatch: expected ${expected_sha}, got ${actual_sha}" >&2
            exit 1
          fi
          echo "Verified exact SHA: ${actual_sha}"

      - name: Set up Rust
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Preflight tmux (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v tmux
          tmux -V

      - name: Materialize F14 A3 same-composition diagnostic tree
        if: ${{ (inputs.test_profile || 'full') == 'f14-a3-same-composition-e2e-diagnostic' || (inputs.test_profile || 'full') == 'f14-a3-same-composition-e2e-causal' || (inputs.test_profile || 'full') == 'f14-a3-same-composition-full-diagnostic' }}
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail

          A3_SHA='a1bd011defa7ae4beec784a663c6bfa28350973f'
          A3_TREE='eee65a25586c7c439221931742b44a590ef3affc'
          OLD_F14_SHA='312d19a38330cf9389fa69f915709f6ec7477b1e'
          F14_FIX_BASE_SHA='221af22d4012c458cbaf589a48ebfc8ba0cc0545'
          CURRENT_F14_SHA='3a2417a1848a9b3944a98ac23ae02ecbee582fa6'
          FRAMEWORK_PATH='crates/team-agent/tests/e2e/framework.rs'
          OLD_FRAMEWORK_BLOB='a1501e1931cc705ddfef9b14154bba1a24388764'
          CURRENT_FRAMEWORK_BLOB='53fe375ff607eb6164073f50658fd91aa0f1b766'
          OLD_FRAMEWORK_SHA256='0fc9964f3f8c6ab2f90d0ff6f1498bcba00ecdb01d3d4ed580a3e46b98ffcffd'
          CURRENT_FRAMEWORK_SHA256='84eece0a37fc544c589c5917c65cc44db5e6c26aa79f19cb745ae3e2530d61b3'
          DIAGNOSTIC_TREE='780e6222fa0c58c3ae7c5b94752b70305b71aba6'

          target_sha="$(printf '%s' "${TARGET_SHA}" | tr '[:upper:]' '[:lower:]')"
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          if [[ "${target_sha}" != "${A3_SHA}" || "${actual_sha}" != "${A3_SHA}" || "${actual_tree}" != "${A3_TREE}" ]]; then
            echo "F14 A3 diagnostic requires exact target/head/tree ${A3_SHA}/${A3_TREE}; got ${target_sha}/${actual_sha}/${actual_tree}" >&2
            exit 1
          fi

          refs_before="$(git for-each-ref --format='%(refname) %(objectname)')"
          git fetch --no-tags --no-write-fetch-head origin "${OLD_F14_SHA}" "${F14_FIX_BASE_SHA}" "${CURRENT_F14_SHA}"
          refs_after="$(git for-each-ref --format='%(refname) %(objectname)')"
          if [[ "${refs_after}" != "${refs_before}" ]]; then
            echo 'Exact-object fetch moved a ref' >&2
            exit 1
          fi
          git cat-file -e "${OLD_F14_SHA}^{commit}"
          git cat-file -e "${F14_FIX_BASE_SHA}^{commit}"
          git cat-file -e "${CURRENT_F14_SHA}^{commit}"

          delta_names="$(git diff --name-only --no-renames "${OLD_F14_SHA}" "${CURRENT_F14_SHA}" --)"
          delta_status="$(git diff --name-status --no-renames "${OLD_F14_SHA}" "${CURRENT_F14_SHA}" --)"
          expected_status="$(printf 'M\t%s' "${FRAMEWORK_PATH}")"
          if [[ "${delta_names}" != "${FRAMEWORK_PATH}" || "${delta_status}" != "${expected_status}" ]]; then
            echo 'Old-to-current F14 delta is not the exact one-file framework modification' >&2
            printf 'names=%s\nstatus=%s\n' "${delta_names}" "${delta_status}" >&2
            exit 1
          fi

          old_blob="$(git rev-parse "${OLD_F14_SHA}:${FRAMEWORK_PATH}")"
          current_blob="$(git rev-parse "${CURRENT_F14_SHA}:${FRAMEWORK_PATH}")"
          a3_blob="$(git rev-parse "${A3_SHA}:${FRAMEWORK_PATH}")"
          old_sha256="$(git show "${OLD_F14_SHA}:${FRAMEWORK_PATH}" | shasum -a 256 | cut -d' ' -f1)"
          current_sha256="$(git show "${CURRENT_F14_SHA}:${FRAMEWORK_PATH}" | shasum -a 256 | cut -d' ' -f1)"
          if [[ "${old_blob}" != "${OLD_FRAMEWORK_BLOB}" || "${a3_blob}" != "${OLD_FRAMEWORK_BLOB}" || "${current_blob}" != "${CURRENT_FRAMEWORK_BLOB}" || "${old_sha256}" != "${OLD_FRAMEWORK_SHA256}" || "${current_sha256}" != "${CURRENT_FRAMEWORK_SHA256}" ]]; then
            echo 'Framework blob or byte digest mismatch' >&2
            exit 1
          fi

          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo 'Checkout is not clean before diagnostic materialization' >&2
            git status --porcelain=v1 --untracked-files=all >&2
            exit 1
          fi

          git diff --binary --full-index --no-ext-diff --no-renames "${OLD_F14_SHA}" "${CURRENT_F14_SHA}" -- "${FRAMEWORK_PATH}" |
            git apply --index --binary --check -
          git diff --binary --full-index --no-ext-diff --no-renames "${OLD_F14_SHA}" "${CURRENT_F14_SHA}" -- "${FRAMEWORK_PATH}" |
            git apply --index --binary -

          applied_blob="$(git hash-object "${FRAMEWORK_PATH}")"
          applied_sha256="$(shasum -a 256 "${FRAMEWORK_PATH}" | cut -d' ' -f1)"
          synthetic_tree="$(git write-tree)"
          synthetic_delta="$(git diff-tree --no-commit-id --name-status -r --no-renames "${A3_TREE}" "${synthetic_tree}")"
          staged_names="$(git diff --cached --name-only --no-renames "${A3_SHA}" --)"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          expected_worktree_status="$(printf 'M  %s' "${FRAMEWORK_PATH}")"
          if [[ "${applied_blob}" != "${CURRENT_FRAMEWORK_BLOB}" || "${applied_sha256}" != "${CURRENT_FRAMEWORK_SHA256}" || "${synthetic_tree}" != "${DIAGNOSTIC_TREE}" || "${synthetic_delta}" != "${expected_status}" || "${staged_names}" != "${FRAMEWORK_PATH}" || "${status}" != "${expected_worktree_status}" ]]; then
            echo 'Materialized diagnostic tree failed exact identity or containment checks' >&2
            exit 1
          fi
          git diff --quiet
          if [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
            echo 'Untracked source entered the diagnostic tree' >&2
            exit 1
          fi

          printf 'F14_A3_DIAGNOSTIC_IDENTITY target=%s old_f14=%s current_f14=%s old_framework_blob=%s current_framework_blob=%s synthetic_tree=%s\n' \
            "${A3_SHA}" "${OLD_F14_SHA}" "${CURRENT_F14_SHA}" "${OLD_FRAMEWORK_BLOB}" "${CURRENT_FRAMEWORK_BLOB}" "${synthetic_tree}"

      - name: Run Rust tests
        env:
          TEST_PROFILE: ${{ inputs.test_profile || 'full' }}
        run: |
          set -euo pipefail
          case "${TEST_PROFILE}" in
            full)
              cargo test --workspace --all-targets --locked --no-fail-fast
              ;;
            a6-message-funnel)
              cargo test -p team-agent --locked --test mcp_simulated_worker_source_red -- --nocapture
              ;;
            f04-r4)
              cargo test -p team-agent --test clone_fork_parallel_lifecycle_red --locked r4_parallel_n_clones_have_pairwise_unique_new_sessions -- --exact --nocapture --test-threads=1
              ;;
            f05-rec002)
              cargo test -p team-agent --test e2e --locked cases::rec_002_doctor_checks::rec_002_doctor_checks -- --exact --nocapture --test-threads=1
              ;;
            f07-c5-diagnostic)
              cargo test -p team-agent --locked --test msg_sendpath_persist_first_contract c5_fanout_rows_are_independent_under_partial_blockers -- --exact --nocapture
              ;;
            f11-e6)
              cargo test -p team-agent --locked --test e6_offline_mailbox_toname_e2e_contract e6_real_cli_live_team_unattached_leader_queues_then_attach_replays_once -- --exact --nocapture
              ;;
            f11-e6-causal)
              PRE_FIX_SHA='8c98a13e867b182546651419a13b00ff59dde7e6'
              FIXED_SHA='0a324586e287aa07e622399ff72bbb052daf86db'
              FIXED_TREE='252e8aca3d45d483200d6d9979c5d212ec2b8f13'
              DELIVERY_PATH='crates/team-agent/src/messaging/delivery.rs'
              PRE_FIX_BLOB='44999d2ec30e6d0987a792402653bd5b27a73bab'
              FIXED_BLOB='bc8cee047cf5b1498d9f097d444c90a58f9ef94e'
              PRE_FIX_SHA256='baff138b58dc832c28a08bc625382d0d850751904a0d433cf2083495651bbda6'
              FIXED_SHA256='0ba9c47b630246c69f2b3534145ad686f3c1ecf3bf71793b641277ae858aa30b'
              GUARD='messaging::tests::leader_inject_acceptance::claimed_leader_delivery_revalidates_a_stale_unattached_snapshot'

              if [[ "$(git rev-parse HEAD)" != "${FIXED_SHA}" || "$(git rev-parse 'HEAD^{tree}')" != "${FIXED_TREE}" ]]; then
                echo 'F11 causal profile requires the exact fixed head and tree' >&2
                exit 1
              fi
              git diff --binary --full-index --no-ext-diff --no-renames "${PRE_FIX_SHA}" "${FIXED_SHA}" -- "${DELIVERY_PATH}" |
                git apply --reverse --binary --check -
              git diff --binary --full-index --no-ext-diff --no-renames "${PRE_FIX_SHA}" "${FIXED_SHA}" -- "${DELIVERY_PATH}" |
                git apply --reverse --binary -

              causal_blob="$(git hash-object "${DELIVERY_PATH}")"
              causal_sha256="$(shasum -a 256 "${DELIVERY_PATH}" | cut -d' ' -f1)"
              causal_status="$(git status --porcelain=v1 --untracked-files=all)"
              expected_status=" M ${DELIVERY_PATH}"
              if [[ "${causal_blob}" != "${PRE_FIX_BLOB}" || "${causal_sha256}" != "${PRE_FIX_SHA256}" || "${causal_status}" != "${expected_status}" ]]; then
                echo 'F11 causal reversal failed exact byte or scope checks' >&2
                exit 1
              fi

              set +e
              cargo test -p team-agent --locked --lib "${GUARD}" -- --exact --nocapture 2>&1 | tee f11-causal-red.log
              causal_exit="${PIPESTATUS[0]}"
              set -e
              if [[ "${causal_exit}" -eq 0 ]]; then
                echo 'F11 causal reversal unexpectedly stayed green' >&2
                exit 1
              fi
              grep -F "test ${GUARD} ... FAILED" f11-causal-red.log >/dev/null || {
                echo 'F11 causal guard did not run non-zero at the selected invariant' >&2
                exit 1
              }
              grep -F 'leader_not_attached' f11-causal-red.log >/dev/null || {
                echo 'F11 causal guard did not recreate the stale leader_not_attached refusal' >&2
                exit 1
              }
              rm f11-causal-red.log
              printf 'F11_CAUSAL_RED runner=%s exit=%s delivery_blob=%s delivery_sha256=%s\n' \
                "${RUNNER_OS}" "${causal_exit}" "${causal_blob}" "${causal_sha256}"

              git restore --source=HEAD --worktree -- "${DELIVERY_PATH}"
              restored_blob="$(git hash-object "${DELIVERY_PATH}")"
              restored_sha256="$(shasum -a 256 "${DELIVERY_PATH}" | cut -d' ' -f1)"
              if [[ "${restored_blob}" != "${FIXED_BLOB}" || "${restored_sha256}" != "${FIXED_SHA256}" || -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
                echo 'F11 causal restore failed exact byte or clean-checkout checks' >&2
                exit 1
              fi
              echo "F11_CAUSAL_RESTORED head=${FIXED_SHA} tree=${FIXED_TREE} delivery_blob=${restored_blob} delivery_sha256=${restored_sha256} status=clean"

              cargo test -p team-agent --locked --lib "${GUARD}" -- --exact --nocapture
              cargo test -p team-agent --locked --test e6_offline_mailbox_toname_e2e_contract e6_real_cli_live_team_unattached_leader_queues_then_attach_replays_once -- --exact --nocapture
              ;;
            f11-e6-cohort)
              cargo test -p team-agent --locked --test e2e --test e2e_bypass_single_source --test e6_offline_mailbox_toname_contract --test e6_offline_mailbox_toname_e2e_contract -- --nocapture
              ;;
            f14-containment)
              cargo test -p team-agent --locked --test e2e framework::containment_tests::f14_owned_socket_registration_is_exact_and_drop_spares_unregistered_socket -- --exact --nocapture --test-threads=1
              cargo test -p team-agent --locked --test e2e cases::send_001_fake_worker::send_001_delivers_to_fake_worker -- --exact --nocapture --test-threads=1
              ;;
            f14-a3-e2e-default)
              cargo test -p team-agent --locked --test e2e -- --nocapture
              ;;
            f14-a3-same-composition-e2e-diagnostic)
              cargo test -p team-agent --locked --test e2e -- --nocapture
              ;;
            f14-a3-same-composition-e2e-causal)
              F14_FIX_BASE_SHA='221af22d4012c458cbaf589a48ebfc8ba0cc0545'
              CURRENT_F14_SHA='3a2417a1848a9b3944a98ac23ae02ecbee582fa6'
              FRAMEWORK_PATH='crates/team-agent/tests/e2e/framework.rs'
              FIX_BASE_FRAMEWORK_BLOB='003cc15da442bc39a1b01e9bfa128ec97de72e2c'
              FIX_BASE_FRAMEWORK_SHA256='44eaf34a0b391247fe40550037878e6de07f1fa351241e4d0d80f2d84120ba6a'
              FIX_BASE_SYNTHETIC_TREE='46e662eee9a5a5d96374ab1d7fd793af749dc00e'
              CURRENT_FRAMEWORK_BLOB='53fe375ff607eb6164073f50658fd91aa0f1b766'
              CURRENT_FRAMEWORK_SHA256='84eece0a37fc544c589c5917c65cc44db5e6c26aa79f19cb745ae3e2530d61b3'

              git diff --binary --full-index --no-ext-diff --no-renames "${F14_FIX_BASE_SHA}" "${CURRENT_F14_SHA}" -- "${FRAMEWORK_PATH}" |
                git apply --reverse --binary --check -
              git diff --binary --full-index --no-ext-diff --no-renames "${F14_FIX_BASE_SHA}" "${CURRENT_F14_SHA}" -- "${FRAMEWORK_PATH}" |
                git apply --reverse --binary -

              causal_blob="$(git hash-object "${FRAMEWORK_PATH}")"
              causal_sha256="$(shasum -a 256 "${FRAMEWORK_PATH}" | cut -d' ' -f1)"
              causal_index="$(mktemp)"
              rm "${causal_index}"
              GIT_INDEX_FILE="${causal_index}" git read-tree HEAD
              GIT_INDEX_FILE="${causal_index}" git update-index --add --cacheinfo "100644,${causal_blob},${FRAMEWORK_PATH}"
              causal_tree="$(GIT_INDEX_FILE="${causal_index}" git write-tree)"
              rm "${causal_index}"
              if [[ "${causal_blob}" != "${FIX_BASE_FRAMEWORK_BLOB}" || "${causal_sha256}" != "${FIX_BASE_FRAMEWORK_SHA256}" || "${causal_tree}" != "${FIX_BASE_SYNTHETIC_TREE}" ]]; then
                echo 'F14 causal reversal failed exact identity checks' >&2
                exit 1
              fi

              set +e
              cargo test -p team-agent --locked --test e2e -- --nocapture 2>&1 | tee f14-causal-red.log
              causal_exit="${PIPESTATUS[0]}"
              set -e
              if [[ "${RUNNER_OS}" == 'macOS' ]]; then
                if [[ "${causal_exit}" -eq 0 ]]; then
                  echo 'F14 causal reversal unexpectedly stayed green on macOS' >&2
                  exit 1
                fi
                for failed_name in \
                  'cases::send_001_fake_worker::send_001_delivers_to_fake_worker' \
                  'cases::gate_hole_061_red::tooth_1_existing_launch_smoke_runs_documented_quick_start_verbatim' \
                  'cases::gate_hole_061_red::tooth_2_existing_send_smoke_proves_worker_receive_report_and_collect'; do
                  grep -F "${failed_name}" f14-causal-red.log | grep -F 'FAILED' >/dev/null || {
                    echo "F14 causal reversal missed expected macOS red: ${failed_name}" >&2
                    exit 1
                  }
                done
              elif [[ "${causal_exit}" -ne 0 ]]; then
                echo 'F14 causal reversal changed the historically green Ubuntu boundary' >&2
                exit 1
              fi
              rm f14-causal-red.log
              printf 'F14_CAUSAL_RED runner=%s exit=%s framework_blob=%s synthetic_tree=%s\n' \
                "${RUNNER_OS}" "${causal_exit}" "${causal_blob}" "${causal_tree}"

              git restore --worktree -- "${FRAMEWORK_PATH}"
              restored_blob="$(git hash-object "${FRAMEWORK_PATH}")"
              restored_sha256="$(shasum -a 256 "${FRAMEWORK_PATH}" | cut -d' ' -f1)"
              if [[ "${restored_blob}" != "${CURRENT_FRAMEWORK_BLOB}" || "${restored_sha256}" != "${CURRENT_FRAMEWORK_SHA256}" ]]; then
                echo 'F14 causal restore failed byte identity checks' >&2
                exit 1
              fi
              git diff --quiet
              echo "F14_CAUSAL_RESTORED framework_blob=${restored_blob} framework_sha256=${restored_sha256}"
              cargo test -p team-agent --locked --test e2e -- --nocapture
              ;;
            f14-a3-same-composition-full-diagnostic)
              cargo test --workspace --all-targets --locked --no-fail-fast
              ;;
            f15-gate061)
              cargo test -p team-agent --locked --test e2e cases::gate_hole_061_red::tooth_1_existing_launch_smoke_runs_documented_quick_start_verbatim -- --exact --nocapture --test-threads=1
              cargo test -p team-agent --locked --test e2e cases::gate_hole_061_red::tooth_2_existing_send_smoke_proves_worker_receive_report_and_collect -- --exact --nocapture --test-threads=1
              ;;
            f16-wleak)
              cargo test -p team-agent --locked --test e2e cases::wleak_worker_delivery_socket_leak_contract::wleak_cached_pane_owned_by_other_window_never_receives_worker_message -- --exact --nocapture --test-threads=1
              ;;
            f17-wleak-metadata)
              cargo test -p team-agent --locked --test e2e cases::wleak_worker_delivery_socket_leak_contract::wleak_message_delivered_event_records_physical_target_metadata -- --exact --nocapture --test-threads=1
              ;;
            *)
              echo "Invalid test profile: ${TEST_PROFILE}" >&2
              exit 1
              ;;
          esac

      - name: Restore F14 A3 diagnostic tree
        if: ${{ always() && ((inputs.test_profile || 'full') == 'f14-a3-same-composition-e2e-diagnostic' || (inputs.test_profile || 'full') == 'f14-a3-same-composition-e2e-causal' || (inputs.test_profile || 'full') == 'f14-a3-same-composition-full-diagnostic') }}
        run: |
          set -euo pipefail
          A3_SHA='a1bd011defa7ae4beec784a663c6bfa28350973f'
          A3_TREE='eee65a25586c7c439221931742b44a590ef3affc'
          FRAMEWORK_PATH='crates/team-agent/tests/e2e/framework.rs'

          git restore --source=HEAD --staged --worktree -- "${FRAMEWORK_PATH}"
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ "${actual_sha}" != "${A3_SHA}" || "${actual_tree}" != "${A3_TREE}" || -n "${status}" ]]; then
            echo 'Failed to restore exact clean A3 job worktree' >&2
            printf 'head=%s\ntree=%s\nstatus=%s\n' "${actual_sha}" "${actual_tree}" "${status}" >&2
            exit 1
          fi
          git diff --quiet "${A3_SHA}" --
          git diff --cached --quiet "${A3_SHA}" --
          echo "F14_A3_DIAGNOSTIC_RESTORED head=${actual_sha} tree=${actual_tree} status=clean"
