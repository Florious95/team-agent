name: Build macOS arm64 candidate

# Manual candidate build and optional scoped verification only. This workflow deliberately has no push, pull_request,
# release, tag, npm, or publish trigger.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact 40-character commit SHA to build"
        required: true
        type: string
      expected_tree:
        description: "Exact 40-character tree SHA expected at source_sha"
        required: true
        type: string
      run_scoped_tests:
        description: "Run nonempty scoped Rust suites and preserve their native exit receipts"
        required: false
        type: boolean
        default: false
      scoped_test_suites:
        description: "Optional newline-separated package|--lib or --test|selector rows; defaults to the integrated lifecycle matrix"
        required: false
        type: string
      incremental_base_sha:
        description: "Optional exact baseline commit to compile first in the same target directory"
        required: false
        type: string
      incremental_base_tree:
        description: "Required exact tree when incremental_base_sha is supplied"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build team-agent (macOS arm64)
    runs-on: macos-15
    env:
      SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
      EXPECTED_TREE_INPUT: ${{ inputs.expected_tree }}
      RUST_TOOLCHAIN: "1.95.0"
      TARGET: "aarch64-apple-darwin"
      INCREMENTAL_BASE_SHA: ${{ inputs.incremental_base_sha }}
      INCREMENTAL_BASE_TREE: ${{ inputs.incremental_base_tree }}
      SCOPED_TEST_SUITES: ${{ inputs.scoped_test_suites }}

    steps:
      - name: Validate dispatch inputs and runner
        shell: bash
        run: |
          set -euo pipefail

          validate_sha() {
            local name="$1"
            local value="$2"
            if [[ ! "$value" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::${name} must be exactly 40 hexadecimal characters"
              exit 1
            fi
          }

          validate_sha source_sha "$SOURCE_SHA_INPUT"
          validate_sha expected_tree "$EXPECTED_TREE_INPUT"
          if [[ -n "$INCREMENTAL_BASE_SHA" || -n "$INCREMENTAL_BASE_TREE" ]]; then
            validate_sha incremental_base_sha "$INCREMENTAL_BASE_SHA"
            validate_sha incremental_base_tree "$INCREMENTAL_BASE_TREE"
          fi

          if [[ "${GITHUB_REPOSITORY:-}" != "Florious95/team-agent" ]]; then
            echo "::error::workflow must run in Florious95/team-agent"
            exit 1
          fi
          if [[ "${RUNNER_OS:-}" != "macOS" || "${RUNNER_ARCH:-}" != "ARM64" ]]; then
            echo "::error::runner must report macOS/ARM64 (got ${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown})"
            exit 1
          fi
          if [[ "$(uname -s)" != "Darwin" || "$(uname -m)" != "arm64" ]]; then
            echo "::error::host must be Darwin arm64 (got $(uname -s)/$(uname -m))"
            exit 1
          fi

      - name: Check out requested source
        uses: actions/checkout@v5
        with:
          repository: Florious95/team-agent
          ref: ${{ env.SOURCE_SHA_INPUT }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Verify source identity and clean checkout
        shell: bash
        run: |
          set -euo pipefail

          source_sha="$(printf '%s' "$SOURCE_SHA_INPUT" | tr '[:upper:]' '[:lower:]')"
          expected_tree="$(printf '%s' "$EXPECTED_TREE_INPUT" | tr '[:upper:]' '[:lower:]')"
          actual_sha="$(git rev-parse --verify HEAD)"
          actual_tree="$(git rev-parse --verify 'HEAD^{tree}')"

          if [[ "$actual_sha" != "$source_sha" ]]; then
            echo "::error::checked out SHA ${actual_sha} does not match requested source SHA"
            exit 1
          fi
          if [[ "$actual_tree" != "$expected_tree" ]]; then
            echo "::error::source tree ${actual_tree} does not match expected tree"
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::source checkout is not clean"
            git status --short
            exit 1
          fi

          printf 'SOURCE_SHA=%s\n' "$actual_sha" >> "$GITHUB_ENV"
          printf 'SOURCE_TREE=%s\n' "$actual_tree" >> "$GITHUB_ENV"

      - name: Install and verify Rust toolchain
        shell: bash
        run: |
          set -euo pipefail

          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" "$TARGET"
          export RUSTUP_TOOLCHAIN="$RUST_TOOLCHAIN"

          rustc_version="$(rustc --version)"
          cargo_version="$(cargo --version)"
          rustc_host="$(rustc -vV | awk '$1 == "host:" { value=$2 } END { if (value != "") print value }')"
          active_toolchain="$(rustup show active-toolchain | awk 'NR == 1 { value=$1 } END { if (value != "") print value }')"

          if [[ "$rustc_version" != "rustc ${RUST_TOOLCHAIN}"* ]]; then
            echo "::error::unexpected rustc version: ${rustc_version}"
            exit 1
          fi
          if [[ "$active_toolchain" != "${RUST_TOOLCHAIN}"* ]]; then
            echo "::error::unexpected active toolchain: ${active_toolchain}"
            exit 1
          fi
          if [[ "$rustc_host" != "$TARGET" ]]; then
            echo "::error::Rust host ${rustc_host} does not match ${TARGET}"
            exit 1
          fi

          printf 'RUSTC_VERSION=%s\n' "$rustc_version" >> "$GITHUB_ENV"
          printf 'CARGO_VERSION=%s\n' "$cargo_version" >> "$GITHUB_ENV"
          printf 'RUSTC_HOST=%s\n' "$rustc_host" >> "$GITHUB_ENV"

      - name: Build requested source (optionally incremental from exact baseline)
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_TOOLCHAIN="$RUST_TOOLCHAIN"
          export CARGO_TARGET_DIR="${RUNNER_TEMP}/team-agent-candidate-target"
          mkdir -p "${RUNNER_TEMP}/candidate-build-receipts"
          receipts="${RUNNER_TEMP}/candidate-build-receipts"
          build_source() {
            local label="$1"
            printf 'source_sha=%s\nsource_tree=%s\ntarget_dir=%s\ncargo_incremental=%s\n' \
              "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" "$CARGO_TARGET_DIR" "${CARGO_INCREMENTAL:-default}" > "$receipts/${label}-source.txt"
            set +e
            cargo build -p team-agent --bin team-agent --release --target "$TARGET" --locked \
              --message-format=json-render-diagnostics > "$receipts/${label}-cargo.jsonl" 2> "$receipts/${label}-cargo.log"
            result=$?
            set -e
            printf '%s\n' "$result" > "$receipts/${label}-cargo.exit"
            if [[ "$result" != 0 ]]; then
              tail -n 100 "$receipts/${label}-cargo.log"
              return "$result"
            fi
          }
          if [[ -n "$INCREMENTAL_BASE_SHA" ]]; then
            export CARGO_INCREMENTAL=1
            git fetch --no-tags --depth=1 origin "$INCREMENTAL_BASE_SHA"
            git checkout --detach "$INCREMENTAL_BASE_SHA"
            test "$(git rev-parse HEAD)" = "$INCREMENTAL_BASE_SHA"
            test "$(git rev-parse 'HEAD^{tree}')" = "$INCREMENTAL_BASE_TREE"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
            build_source baseline
            git checkout --detach "$SOURCE_SHA"
            test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          fi
          build_source candidate
          printf 'CANDIDATE_TARGET_DIR=%s\n' "$CARGO_TARGET_DIR" >> "$GITHUB_ENV"

      - name: Run scoped Rust verification
        if: inputs.run_scoped_tests
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_TOOLCHAIN="$RUST_TOOLCHAIN"
          export CARGO_TARGET_DIR="$CANDIDATE_TARGET_DIR"
          export RUST_BACKTRACE=1
          receipts="${RUNNER_TEMP}/candidate-build-receipts/tests"
          mkdir -p "$receipts"
          printf 'source_sha=%s\nsource_tree=%s\nrustc=%s\ntarget=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" "$(rustc --version)" "$TARGET" > "$receipts/source.txt"
          if ! command -v tmux >/dev/null; then brew install tmux; fi
          tmux -V > "$receipts/tmux-version.txt"
          cases=(
            'team-agent|--lib|leader::'
            'team-agent|--lib|state::'
            'team-agent|--lib|station::projection::'
            'team-agent|--lib|direct_delivery::'
            'team-agent|--lib|cli::intent::'
            'team-agent|--lib|cli::doctor_probe::'
            'team-agent|--lib|cli::tests::leader_watch::'
            'team-agent|--lib|cli::lifecycle_port::'
            'team-agent|--lib|cli::adapters::'
            'team-agent|--lib|lifecycle::launch::'
            'team-agent|--lib|lifecycle::restart::'
            'team-agent|--lib|contract_runtime::'
            'team-agent|--lib|tmux_backend::'
            'team-agent|--test|messaging_scope_regression'
            'team-agent|--test|claim_endpoint_convergence_contract'
            'team-agent|--test|endpoint_convergence_persistence_contract'
            'team-agent-contract|--test|codex_contract'
          )
          if [[ -n "$SCOPED_TEST_SUITES" ]]; then
            cases=()
            while IFS= read -r item; do
              if [[ -n "$item" ]]; then cases+=("$item"); fi
            done <<< "$SCOPED_TEST_SUITES"
          fi
          test "${#cases[@]}" -gt 0
          failed=0
          index=0
          for item in "${cases[@]}"; do
            IFS='|' read -r package kind selector <<< "$item"
            case "$package:$kind" in
              team-agent:--lib|team-agent:--test|team-agent-contract:--lib|team-agent-contract:--test) ;;
              *) echo "::error::invalid scoped test package/target: $item"; exit 2 ;;
            esac
            if [[ ! "$selector" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_:-]*$ ]]; then
              echo "::error::invalid scoped test selector: $selector"; exit 2
            fi
            label="$(printf '%02d' "$index")"
            printf '%s\n' "$item" > "$receipts/$label.command"
            set +e
            test_args=(--locked --manifest-path "crates/$package/Cargo.toml" --target "$TARGET" -p "$package" "$kind" "$selector" -- --test-threads=1)
            printf '%q ' cargo test "${test_args[@]}" > "$receipts/$label.argv"
            printf '\n' >> "$receipts/$label.argv"
            cargo test "${test_args[@]}" > "$receipts/$label.log" 2>&1
            code=$?
            set -e
            printf '%s\n' "$code" > "$receipts/$label.exit"
            printf '%s\t%s\t%s\n' "$label" "$item" "$code" >> "$receipts/summary.tsv"
            grep '^test result:' "$receipts/$label.log" || true
            if [[ "$code" != 0 ]] || ! grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$receipts/$label.log"; then
              failed=1
              tail -n 100 "$receipts/$label.log"
            fi
            # No test verdict means compilation/infrastructure failed. Do not
            # repeatedly compile the same broken source or mark unrun suites green.
            if ! grep -q '^test result:' "$receipts/$label.log"; then break; fi
            index=$((index + 1))
          done
          printf '%s\n' "$failed" > "$receipts/scoped-tests.exit"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git diff --exit-code
          exit "$failed"

      - name: Verify and package candidate
        shell: bash
        run: |
          set -euo pipefail

          built_binary="${CANDIDATE_TARGET_DIR}/${TARGET}/release/team-agent"
          dist="dist"
          binary_name="team-agent-aarch64-apple-darwin"
          binary="${dist}/${binary_name}"
          archive="${dist}/team-agent-macos-arm64.tar.gz"

          test -x "$built_binary"
          file_info="$(file "$built_binary")"
          if [[ "$file_info" != *"Mach-O"* || "$file_info" != *"arm64"* ]]; then
            echo "::error::build is not a Mach-O arm64 executable: ${file_info}"
            exit 1
          fi
          archs="$(lipo -archs "$built_binary" | tr -d '[:space:]')"
          if [[ "$archs" != "arm64" ]]; then
            echo "::error::build architectures are not exactly arm64: ${archs}"
            exit 1
          fi

          package_name="$(awk '
            /^\[package\]$/ { in_package=1; next }
            in_package && /^\[/ { exit }
            in_package && /^[[:space:]]*name[[:space:]]*=/ {
              sub(/^[^\"]*\"/, "")
              sub(/\".*$/, "")
              print
              exit
            }
          ' crates/team-agent/Cargo.toml)"
          if [[ "$package_name" != "team-agent" ]]; then
            echo "::error::unexpected target package name: ${package_name}"
            exit 1
          fi
          version="$(awk '
            /^\[workspace\.package\]$/ { in_workspace=1; next }
            in_workspace && /^\[/ { exit }
            in_workspace && /^[[:space:]]*version[[:space:]]*=/ {
              sub(/^[^\"]*\"/, "")
              sub(/\".*$/, "")
              print
              exit
            }
          ' Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo "::error::workspace package version is missing"
            exit 1
          fi
          expected_cli_version="${package_name} ${version}"

          rm -rf "$dist"
          mkdir -p "$dist"
          cp "$built_binary" "$binary"
          chmod 755 "$binary"
          "$binary" --version > "${dist}/CLI-VERSION.txt"
          test -s "${dist}/CLI-VERSION.txt"
          actual_cli_version="$(<"${dist}/CLI-VERSION.txt")"
          if [[ "$actual_cli_version" != "$expected_cli_version" ]]; then
            printf '::error::unexpected --version output: %s; expected %s\n' "$actual_cli_version" "$expected_cli_version"
            exit 1
          fi

          binary_sha256="$(shasum -a 256 "$binary" | awk '{ print $1 }')"
          cat > "${dist}/SOURCE.txt" <<EOF
          source_sha=${SOURCE_SHA}
          source_tree=${SOURCE_TREE}
          expected_source_sha=$(printf '%s' "$SOURCE_SHA_INPUT" | tr '[:upper:]' '[:lower:]')
          expected_tree=$(printf '%s' "$EXPECTED_TREE_INPUT" | tr '[:upper:]' '[:lower:]')
          repository=${GITHUB_REPOSITORY}
          EOF
          cat > "${dist}/BUILD.txt" <<EOF
          workflow_sha=${GITHUB_WORKFLOW_SHA}
          workflow_ref=${GITHUB_WORKFLOW_REF}
          run_context_sha=${GITHUB_SHA}
          run_context_ref=${GITHUB_REF}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_attempt=${GITHUB_RUN_ATTEMPT}
          runner_name=${RUNNER_NAME}
          runner_os=${RUNNER_OS}
          runner_arch=${RUNNER_ARCH}
          host_os=$(uname -s)
          host_arch=$(uname -m)
          macos_version=$(sw_vers -productVersion)
          rust_toolchain=${RUST_TOOLCHAIN}
          rustc_version=${RUSTC_VERSION}
          rustc_host=${RUSTC_HOST}
          cargo_version=${CARGO_VERSION}
          target=${TARGET}
          version=${version}
          binary_sha256=${binary_sha256}
          incremental_base_sha=${INCREMENTAL_BASE_SHA}
          incremental_base_tree=${INCREMENTAL_BASE_TREE}
          EOF

          tar -czf "$archive" -C "$dist" "$binary_name" SOURCE.txt BUILD.txt CLI-VERSION.txt
          archive_mode="$(tar -tvf "$archive" | awk -v name="$binary_name" '$NF == name { value=$1 } END { if (value != "") print value }')"
          if [[ "$archive_mode" != -rwx* ]]; then
            echo "::error::tar archive did not preserve executable mode: ${archive_mode}"
            exit 1
          fi

          (
            cd "$dist"
            shasum -a 256 \
              "$binary_name" \
              team-agent-macos-arm64.tar.gz \
              SOURCE.txt \
              BUILD.txt \
              CLI-VERSION.txt > SHA256SUMS
          )
          test -s "${dist}/SHA256SUMS"
          for output in "$binary" "$archive" "${dist}/SOURCE.txt" "${dist}/BUILD.txt" "${dist}/CLI-VERSION.txt" "${dist}/SHA256SUMS"; do
            test -f "$output"
          done

      - name: Upload build receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-build-receipts-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-build-receipts/
          if-no-files-found: error
          retention-days: 7

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-agent-macos-arm64-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 7
