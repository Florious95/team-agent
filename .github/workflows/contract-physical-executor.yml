name: RFS005 isolated fixture investigation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rfs005-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze production source and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir rfs005-evidence
          git rev-parse HEAD 'HEAD^{tree}' > rfs005-evidence/source.txt
          git diff --exit-code 9eee354655375180d99ed2e8d0a636dfc32f1b84 -- crates/team-agent/src Cargo.lock Cargo.toml crates/team-agent/Cargo.toml
          rustup toolchain install 1.95.0 --profile minimal
          if ! command -v tmux >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y tmux
          fi
          { uname -a; rustc -vV; cargo --version; tmux -V; nproc; } > rfs005-evidence/host.txt
      - name: Compile and exercise exact unchanged RFS005 baseline
        shell: bash
        run: |
          set -euo pipefail
          fixture=crates/team-agent/tests/e2e/cases/rfs_restart_false_success_contract.rs
          git show 9eee354655375180d99ed2e8d0a636dfc32f1b84:"$fixture" > "$fixture"
          sha256sum "$fixture" > rfs005-evidence/original-fixture.sha256
          cargo test -p team-agent --test e2e --locked --no-run --message-format=json > rfs005-evidence/baseline-build.json 2> rfs005-evidence/baseline-build.log
          python3 - <<'PY'
          import json, pathlib, shutil
          rows=[json.loads(s) for s in pathlib.Path('rfs005-evidence/baseline-build.json').read_text().splitlines()]
          binary=next(x['executable'] for x in rows if x.get('target',{}).get('name')=='e2e' and x.get('executable'))
          shutil.copy2(binary, '/tmp/rfs005-baseline-e2e')
          PY
          sha256sum target/debug/team-agent > rfs005-evidence/baseline-product.sha256
          python3 .github/rfs005-repeat.py baseline /tmp/rfs005-baseline-e2e 150
          git restore --worktree -- "$fixture"
      - name: Compile test-only observation and quiesced positive control
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p team-agent --test e2e --locked --no-run --message-format=json > rfs005-evidence/observed-build.json 2> rfs005-evidence/observed-build.log
          python3 - <<'PY'
          import json, pathlib, shutil
          rows=[json.loads(s) for s in pathlib.Path('rfs005-evidence/observed-build.json').read_text().splitlines()]
          binary=next(x['executable'] for x in rows if x.get('target',{}).get('name')=='e2e' and x.get('executable'))
          shutil.copy2(binary, '/tmp/rfs005-observed-e2e')
          PY
          sha256sum target/debug/team-agent > rfs005-evidence/observed-product.sha256
          cmp rfs005-evidence/baseline-product.sha256 rfs005-evidence/observed-product.sha256
          python3 .github/rfs005-repeat.py observe /tmp/rfs005-observed-e2e 80
          python3 .github/rfs005-repeat.py quiesced /tmp/rfs005-observed-e2e 30
          gcc -shared -fPIC -Wall -Wextra -Werror .github/rfs005-rename-barrier.c -ldl -o /tmp/rfs005-rename-barrier.so
          sha256sum .github/rfs005-rename-barrier.c /tmp/rfs005-rename-barrier.so > rfs005-evidence/barrier-apparatus.sha256
          python3 .github/rfs005-repeat.py barrier /tmp/rfs005-observed-e2e 3
      - name: Bind evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 9eee354655375180d99ed2e8d0a636dfc32f1b84 -- crates/team-agent/src Cargo.lock Cargo.toml crates/team-agent/Cargo.toml
          git status --porcelain=v1 > rfs005-evidence/final-source-status.txt
          (cd rfs005-evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rfs005-independent-${{ github.run_id }}
          path: rfs005-evidence/
          if-no-files-found: error
          retention-days: 14
