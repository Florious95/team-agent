name: Contract physical executor (controlled macOS fixtures)

on:
  pull_request:
    paths:
      - "crates/team-agent-contract/**"
      - ".github/workflows/contract-physical-executor.yml"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional exact product SHA for finite Grok/root regression
        required: false
        default: ""
        type: string
      expected_tree:
        description: Exact product tree when source_sha is supplied
        required: false
        default: ""
        type: string
      regression_scope:
        description: Fixed finite suite or owned host ancestry/native target
        required: false
        default: full
        type: choice
        options:
          - full
          - host-ancestry
          - host-native
          - issue321
          - issue321-full
          - issue321-f1
          - issue326
          - issue334-red
          - issue334
          - cli-phase1
          - cli-phase1-format
          - cli-phase1-e2e

permissions:
  contents: read

jobs:
  cli-phase1-format:
    if: github.event_name == 'workflow_dispatch' && inputs.source_sha != '' && (inputs.regression_scope == 'cli-phase1' || inputs.regression_scope == 'cli-phase1-format')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
      SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source and format only the bounded new surface
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1)"
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          mkdir format-evidence
          git rev-parse HEAD 'HEAD^{tree}' > format-evidence/source.txt
          files=(crates/team-agent/src/cli/arguments.rs crates/team-agent/src/cli/intent.rs crates/team-agent/src/cli/intent/runtime.rs crates/team-agent/src/cli/intent/tests.rs crates/team-agent/src/cli/intent/runtime_tests.rs crates/team-agent/src/cli/tests/parser_safety.rs crates/team-agent/tests/cli_human_surface_red.rs crates/team-agent/tests/excise_group1_commands_contract.rs crates/team-agent/tests/support/human_catalog.rs)
          set +e
          rustfmt --edition 2021 --config skip_children=true --check "${files[@]}" > format-evidence/format.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > format-evidence/format.exit
          rustfmt --edition 2021 --config skip_children=true "${files[@]}"
          git diff --binary -- "${files[@]}" > format-evidence/format.patch
          (cd format-evidence && sha256sum ./* > SHA256SUMS)
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-phase1-format-${{ github.run_id }}
          path: format-evidence/
          if-no-files-found: error
          retention-days: 14

  macos-fixtures:
    if: github.event_name != 'workflow_dispatch' || inputs.source_sha == ''
    runs-on: macos-14
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
      CONTRACT_OLD_SCOPE: "fixture-old-scope"
      TEAM_AGENT_K2_FOREIGN_PROBE: "fixture-foreign-team"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare fixed toolchain and controlled fixture executables
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          if ! command -v tmux >/dev/null; then brew install tmux; fi
          printf 'CONTRACT_TMUX=%s\n' "$(command -v tmux)" >> "$GITHUB_ENV"
          printf 'CONTRACT_PYTHON=%s\n' "$(python3 -c 'import os,sys; print(os.path.realpath(sys.executable))')" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s\n' "$RUNNER_TEMP/contract-physical-target" >> "$GITHUB_ENV"
          mkdir contract-evidence
          git rev-parse HEAD 'HEAD^{tree}' > contract-evidence/source.txt
          rustc -vV > contract-evidence/toolchain.txt
          cargo --version >> contract-evidence/toolchain.txt
          tmux -V >> contract-evidence/toolchain.txt
          python3 --version >> contract-evidence/toolchain.txt
      - name: Execute contract and real-tmux fake-process tests
        shell: bash
        run: |
          set -uo pipefail
          cargo test --manifest-path crates/team-agent-contract/Cargo.toml --locked --all-targets --no-fail-fast -- --nocapture 2>&1 | tee contract-evidence/test.log
          statuses=("${PIPESTATUS[@]}")
          printf '%s\n' "${statuses[0]}" > contract-evidence/test.exit
          test "${statuses[1]}" -eq 0 || exit 125
          exit "${statuses[0]}"
      - name: Clippy
        shell: bash
        run: |
          set -uo pipefail
          cargo clippy --manifest-path crates/team-agent-contract/Cargo.toml --locked --all-targets -- -D warnings 2>&1 | tee contract-evidence/clippy.log
          statuses=("${PIPESTATUS[@]}")
          printf '%s\n' "${statuses[0]}" > contract-evidence/clippy.exit
          test "${statuses[1]}" -eq 0 || exit 125
          exit "${statuses[0]}"
      - name: Check scoped formatting and source integrity
        shell: bash
        run: |
          set -euo pipefail
          # Check the bounded native-input/watchdog files, not unrelated historical debt.
          files=(
            crates/team-agent/src/messaging/enter_rescue.rs
            crates/team-agent/src/messaging/enter_rescue_tests.rs
            crates/team-agent/src/messaging/delivery_consumption_tests.rs
            crates/team-agent/src/tmux_backend/native_input.rs
            crates/team-agent/src/tmux_backend/native_input_tests.rs
            crates/team-agent/src/tmux_backend/enter_rescue.rs
            crates/team-agent/src/tmux_backend/enter_rescue_tests.rs
            crates/team-agent/src/transport/native_input.rs
            crates/team-agent/src/transport/enter_rescue.rs
          )
          set +e
          rustfmt --edition 2021 --config skip_children=true --check "${files[@]}" 2>&1 | tee contract-evidence/format.log
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > contract-evidence/format.exit
          test "${statuses[1]}" -eq 0 || exit 125
          test "${statuses[0]}" -eq 0
          git diff --exit-code
      - name: Preserve exact logs and receipt hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -d contract-evidence; then
            (cd contract-evidence && shasum -a 256 ./* > artifact-sha256.txt)
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-physical-${{ github.run_id }}-${{ github.run_attempt }}
          path: contract-evidence/
          if-no-files-found: error
          retention-days: 14

  grok-root-regression:
    if: github.event_name == 'workflow_dispatch' && inputs.source_sha != '' && inputs.regression_scope != 'issue321-f1' && inputs.regression_scope != 'cli-phase1-format' && inputs.regression_scope != 'cli-phase1-e2e'
    runs-on: macos-14
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
      REGRESSION_SCOPE: ${{ inputs.regression_scope }}
      RUSTUP_TOOLCHAIN: "1.95.0"
      CONTRACT_OLD_SCOPE: fixture-old-scope
      TEAM_AGENT_K2_FOREIGN_PROBE: fixture-foreign-team
    steps:
      - name: Validate fixed inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify product source and prepare controlled fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1)"
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          if ! command -v tmux >/dev/null; then brew install tmux; fi
          printf 'CONTRACT_TMUX=%s\n' "$(command -v tmux)" >> "$GITHUB_ENV"
          printf 'CONTRACT_PYTHON=%s\n' "$(python3 -c 'import os,sys; print(os.path.realpath(sys.executable))')" >> "$GITHUB_ENV"
          mkdir regression-evidence
          git rev-parse HEAD 'HEAD^{tree}' > regression-evidence/source.txt
          rustc -vV > regression-evidence/toolchain.txt
          cargo --version >> regression-evidence/toolchain.txt
          tmux -V >> regression-evidence/toolchain.txt
          python3 --version >> regression-evidence/toolchain.txt
      - name: Execute finite root and contract regressions
        shell: bash
        run: |
          set -euo pipefail
          run_case() {
            local name="$1"
            shift
            set +e
            "$@" 2>&1 | tee "regression-evidence/${name}.log"
            local statuses=("${PIPESTATUS[@]}")
            set -e
            printf '%s\n' "${statuses[0]}" > "regression-evidence/${name}.exit"
            test "${statuses[1]}" -eq 0 || return 125
            return "${statuses[0]}"
          }
          case "$REGRESSION_SCOPE" in
            host-ancestry)
              run_case host-ancestry cargo test --manifest-path crates/team-agent-contract/Cargo.toml --test host_ancestry --locked -- --test-threads=1
              ;;
            host-native)
              run_case host-native cargo test --manifest-path crates/team-agent-contract/Cargo.toml --test host_native --locked -- --test-threads=1
              ;;
            issue334-red)
              run_case workspace-check cargo check --workspace --all-targets --locked
              run_case parser-safety cargo test -p team-agent --lib --locked cli::emit::parser_safety_tests -- --test-threads=1
              ;;
            cli-phase1)
              run_case workspace-check cargo check --workspace --all-targets --locked
              run_case cli-parser cargo test -p team-agent --lib --locked cli::emit:: -- --test-threads=1
              run_case cli-commands cargo test -p team-agent --lib --locked cli::tests:: -- --test-threads=1
              run_case cli-intent cargo test -p team-agent --lib --locked cli::intent:: -- --test-threads=1
              run_case cli-human cargo test -p team-agent --test cli_human_surface_red --locked -- --test-threads=1
              run_case excised-commands cargo test -p team-agent --test excise_group1_commands_contract --locked -- --test-threads=1
              run_case root-restart cargo test -p team-agent --lib --locked lifecycle::restart -- --test-threads=1
              run_case root-role cargo test -p team-agent --lib --locked lifecycle::role_config -- --test-threads=1
              run_case root-contract cargo test -p team-agent --lib --locked contract_runtime -- --test-threads=1
              run_case contract-all cargo test --manifest-path crates/team-agent-contract/Cargo.toml --locked --all-targets --no-fail-fast -- --test-threads=1
              ;;
            issue334)
              run_case workspace-check cargo check --workspace --all-targets --locked
              run_case cli-parser cargo test -p team-agent --lib --locked cli::emit:: -- --test-threads=1
              run_case cli-commands cargo test -p team-agent --lib --locked cli::tests:: -- --test-threads=1
              ;;
            issue326)
              run_case ambient-authority cargo test -p team-agent --test leader_launcher_ambient_pane_authority_red --locked -- --test-threads=1
              run_case root-leader cargo test -p team-agent --lib --locked leader:: -- --test-threads=1
              run_case launcher-dispatch cargo test -p team-agent --test leader_launcher_n41_path_dispatch_red --locked -- --test-threads=1
              run_case pane-workspace cargo test -p team-agent --test pane_workspace_mismatch_red --locked -- --test-threads=1
              run_case managed-reentry cargo test -p team-agent --test managed_leader_provider_reentry_contract --locked -- --test-threads=1
              ;;
            issue321|issue321-full)
              run_case workspace-check cargo check --workspace --all-targets --locked
              run_case contract-check cargo check --manifest-path crates/team-agent-contract/Cargo.toml --all-targets --locked
              run_case root-tmux cargo test -p team-agent --lib --locked tmux_backend -- --test-threads=1
              run_case root-transport cargo test -p team-agent --lib --locked transport:: -- --test-threads=1
              run_case root-messaging cargo test -p team-agent --lib --locked messaging:: -- --test-threads=1
              run_case root-input-lock cargo test -p team-agent --lib --locked pane_input_lock -- --test-threads=1
              run_case input-channel-lock cargo test -p team-agent --test pane_input_channel_lock --locked -- --test-threads=1
              run_case contract-birth-port cargo test --manifest-path crates/team-agent-contract/Cargo.toml --lib --locked process_birth_identity -- --test-threads=1
              run_case contract-composer-port cargo test --manifest-path crates/team-agent-contract/Cargo.toml --lib --locked composer_observation_tests -- --test-threads=1
              if test "$REGRESSION_SCOPE" = issue321-full; then
                run_case contract-all cargo test --manifest-path crates/team-agent-contract/Cargo.toml --locked --all-targets --no-fail-fast -- --test-threads=1
              fi
              ;;
            full)
              run_case root-stopped cargo test -p team-agent --lib --locked stop -- --test-threads=1
              run_case root-shutdown cargo test -p team-agent --lib --locked shutdown -- --test-threads=1
              run_case root-restart cargo test -p team-agent --lib --locked lifecycle::restart -- --test-threads=1
              run_case root-contract cargo test -p team-agent --lib --locked contract_runtime -- --test-threads=1
              run_case public-lifecycle cargo test -p team-agent --test add_agent_restart_saveconflict_contract --locked -- --test-threads=1
              run_case claim-endpoint cargo test -p team-agent --test claim_endpoint_convergence_contract --locked -- --test-threads=1
              run_case reboot-recovery cargo test -p team-agent --test reboot_recovery_followup_0531_contract --locked -- --test-threads=1
              run_case restart-precision cargo test -p team-agent --test restart_recovery_precision_0532_contract --locked -- --test-threads=1
              run_case shutdown-annotation cargo test -p team-agent --test shutdown_and_annotation_batch5_6 --locked -- --test-threads=1
              run_case e2e cargo test -p team-agent --test e2e --locked -- --test-threads=1
              run_case contract-all cargo test --manifest-path crates/team-agent-contract/Cargo.toml --locked --all-targets --no-fail-fast -- --test-threads=1
              ;;
            *) exit 64 ;;
          esac
      - name: Check scoped formatting and retain a remote formatting patch
        if: always() && (inputs.regression_scope == 'issue321' || inputs.regression_scope == 'issue321-full' || inputs.regression_scope == 'issue334' || inputs.regression_scope == 'issue334-red' || inputs.regression_scope == 'cli-phase1')
        shell: bash
        run: |
          set -euo pipefail
          # Retain a remote-only formatting patch for the bounded changed modules.
          # No historical SHA freeze or unrelated legacy-body formatting rewrite.
          files=(
            crates/team-agent/src/messaging/enter_rescue.rs
            crates/team-agent/src/messaging/enter_rescue_tests.rs
            crates/team-agent/src/messaging/delivery_consumption_tests.rs
            crates/team-agent/src/tmux_backend/native_input.rs
            crates/team-agent/src/tmux_backend/native_input_tests.rs
            crates/team-agent/src/tmux_backend/enter_rescue.rs
            crates/team-agent/src/tmux_backend/enter_rescue_tests.rs
            crates/team-agent/src/transport/native_input.rs
            crates/team-agent/src/transport/enter_rescue.rs
          )
          set +e
          if [[ "$REGRESSION_SCOPE" == issue334* ]]; then
            files=(crates/team-agent/src/cli/arguments.rs crates/team-agent/src/cli/tests/parser_safety.rs)
          fi
          if [[ "$REGRESSION_SCOPE" == cli-phase1 ]]; then
            files=(crates/team-agent/src/cli/arguments.rs crates/team-agent/src/cli/intent.rs crates/team-agent/src/cli/intent/runtime.rs crates/team-agent/src/cli/intent/tests.rs crates/team-agent/src/cli/intent/runtime_tests.rs crates/team-agent/src/cli/tests/parser_safety.rs crates/team-agent/tests/cli_human_surface_red.rs crates/team-agent/tests/excise_group1_commands_contract.rs crates/team-agent/tests/support/human_catalog.rs)
          fi
          rustfmt --edition 2021 --config skip_children=true --check "${files[@]}" > regression-evidence/format.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > regression-evidence/format.exit
          rustfmt --edition 2021 --config skip_children=true "${files[@]}"
          git diff --binary -- "${files[@]}" > regression-evidence/format.patch
          git restore --worktree -- "${files[@]}"
          exit "$rc"
      - name: Bind retained evidence hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -d regression-evidence; then
            (cd regression-evidence && shasum -a 256 ./* > SHA256SUMS)
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grok-root-regression-${{ github.run_id }}
          path: regression-evidence/
          if-no-files-found: error
          retention-days: 14

  workspace-all-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.source_sha != '' && (inputs.regression_scope == 'issue321-full' || inputs.regression_scope == 'issue321-f1' || inputs.regression_scope == 'issue334' || inputs.regression_scope == 'cli-phase1' || inputs.regression_scope == 'cli-phase1-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact workspace source and prepare published-platform toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1)"
          rustup toolchain install 1.95.0 --profile minimal
          if ! command -v tmux >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y tmux
          fi
          mkdir workspace-evidence
          git rev-parse HEAD 'HEAD^{tree}' > workspace-evidence/source.txt
          rustc -vV > workspace-evidence/toolchain.txt
          cargo --version >> workspace-evidence/toolchain.txt
          tmux -V >> workspace-evidence/toolchain.txt
      - name: Run fixed workspace or controlled role-fixture target
        shell: bash
        run: |
          set -uo pipefail
          set +e
          command=(cargo test --workspace --locked --no-fail-fast)
          if test "${{ inputs.regression_scope }}" = issue321-f1; then
            command=(cargo test -p team-agent --test role_config_minimal_diff_red --locked -- --test-threads=1)
          fi
          if test "${{ inputs.regression_scope }}" = cli-phase1-e2e; then
            command=(cargo test -p team-agent --test e2e --locked -- --test-threads=1)
          fi
          "${command[@]}" 2>&1 | tee workspace-evidence/test.log
          statuses=("${PIPESTATUS[@]}")
          printf '%s\n' "${statuses[0]}" > workspace-evidence/test.exit
          test "${statuses[1]}" -eq 0 || exit 125
          exit "${statuses[0]}"
      - name: Bind full-workspace receipt hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -d workspace-evidence; then
            (cd workspace-evidence && sha256sum ./* > SHA256SUMS)
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-issue321-${{ github.run_id }}
          path: workspace-evidence/
          if-no-files-found: error
          retention-days: 14
