name: Targeted B5-E4 verification

on:
  push:
    branches:
      - fix/b5-e4-anchor-signature
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Cargo test target filter"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Targeted B5-E4 test
    runs-on: ubuntu-latest
    steps:
      - name: Check out requested source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - name: Run targeted test
        shell: bash
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          set -euo pipefail
          FILTER="${TEST_FILTER:---test b5_e4_exec_provider_anchor_red}"
          cargo test -p team-agent --locked ${FILTER} -- --test-threads=1 --nocapture
